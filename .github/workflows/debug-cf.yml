name: Debug CF Config (read-only)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Query zone + workers routes + pages domains
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "04cb89946d7679fd8b1372bc6e5a6f1e"
        run: |
          echo "=== ZONES ==="
          ZONE_JSON=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=nkcabtaxi.com")
          echo "$ZONE_JSON" | head -c 3000
          ZONE_ID=$(echo "$ZONE_JSON" | grep -o '"id":"[a-f0-9]*"' | head -1 | cut -d'"' -f4)
          echo ""
          echo "ZONE_ID=$ZONE_ID"

          echo "=== WORKER ROUTES ON ZONE ==="
          if [ -n "$ZONE_ID" ]; then
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" | head -c 3000
            echo ""
            echo "=== PAGE RULES ==="
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/pagerules" | head -c 3000
            echo ""
            echo "=== SNIPPETS ==="
            curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/snippets" | head -c 2000
          fi

          echo ""
          echo "=== PAGES PROJECTS IN ACCOUNT ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
            | grep -o '"name":"[^"]*"\|"domains":\[[^]]*\]' | head -c 3000

          echo ""
          echo "=== NK-CAB-TAXI DOMAINS ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/nk-cab-taxi/domains" \
            | head -c 2000

          echo ""
          echo "=== LATEST DEPLOYMENTS ==="
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/nk-cab-taxi/deployments?per_page=3" \
            | grep -o '"id":"[^"]*"\|"environment":"[^"]*"\|"created_on":"[^"]*"\|"latest_stage":"[^"]*"' | head -40
